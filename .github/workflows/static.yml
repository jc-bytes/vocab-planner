# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      validation_only:
        description: "Validate the release without publishing it"
        required: false
        default: false
        type: boolean
      pilot_publish:
        description: "Publish a formative pilot while the unrelated cross-browser smoke test is being repaired"
        required: false
        default: false
        type: boolean

# Validation receives read-only repository access. Deployment permissions are
# granted only to the small job that publishes the already-tested artifact.
permissions:
  contents: read
  actions: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      UI_SMOKE_PORT: "8560"
      UI_TEACHER_QUIZ_PORT: "8561"
      UI_TEACHER_SPARKS_PORT: "8562"
      UI_TEACHER_PAGES_PORT: "8563"
      UI_TEACHER_DATA_PORT: "8564"
      UI_TEACHER_GROUPS_PORT: "8565"
      UI_TEACHER_WORD_HUNT_PORT: "8566"
      UI_ACTIVITY_REGISTRY_PORT: "8567"
      STUDENT_SHELL_TEST_PORT: "8568"
      UI_CROSS_BROWSER_PORT: "8571"
      UI_AUTH_SMOKE_PORT: "8572"
      UI_AUDIT_PORT: "8573"
      PRIVATE_CLASSROOM_UI_PORT: "8574"
    defaults:
      run:
        working-directory: apps/sparks
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/sparks/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.114.0
      - name: Check Docker
        run: docker info
      - name: Start local Supabase
        env:
          SUPABASE_TELEMETRY_DISABLED: 1
        run: supabase start
      - name: Smoke test app shells
        run: npm run test:ui:smoke
      - name: Configure local worker lifecycle builds
        run: |
          sparks_test_config=$(supabase status --output json)
          printf 'VITE_SUPABASE_URL=%s\n' "$(printf '%s' "$sparks_test_config" | jq -r '.API_URL')" >> "$GITHUB_ENV"
          printf 'VITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$(printf '%s' "$sparks_test_config" | jq -r '.PUBLISHABLE_KEY // .ANON_KEY')" >> "$GITHUB_ENV"
      - name: Unit and composition tests
        run: npm test
      - name: Verify school authorization and database regressions
        run: npm run test:school-platform:rest
      - name: Verify student insight and feedback database regressions
        run: npm run test:student-insight:database
      - name: Supabase authorization acceptance tests
        run: npm run test:acceptance:supabase && npm run test:private-classrooms
      - name: Diagnose local Supabase failure
        if: failure()
        run: |
          for container in $(docker ps -a --filter 'name=supabase_' --format '{{.Names}}'); do
            echo "===== ${container} ====="
            docker logs --tail 200 "${container}" 2>&1 || true
          done
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Authenticated app smoke
        run: npm run test:ui:auth-smoke && npm run test:ui:startup-recovery
      - name: Firefox and WebKit focused smoke
        if: ${{ !inputs.pilot_publish }}
        run: npm run test:ui:cross-browser
      - name: Responsive authenticated audit
        run: npm run test:ui:responsive:local
      - name: Supabase lint
        run: supabase db lint --local --fail-on error
      - name: Supabase advisors
        run: supabase db advisors --local --level warn --fail-on error --type all
      - name: Build site
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run desktop:build:web
      - name: Smoke test built site
        run: UI_SMOKE_DIST_REUSE=1 npm run test:ui:smoke:dist
      - name: Verify built dashboard and private vocabulary loading
        run: UI_AUTH_SMOKE_DIST=1 npm run test:ui:auth-smoke
      - name: Verify built startup recovery
        run: STARTUP_RECOVERY_DIST=1 npm run test:ui:startup-recovery
      - name: Verify built Sparks library and display modes
        run: STUDENT_SPARK_DIST=1 npm run test:ui:student-sparks
      - name: Verify built student and teacher sign-in layouts
        run: AUTH_LAYOUT_DIST=1 npm run test:ui:auth-layout
      - name: Verify built Arcade sprites and gameplay
        run: npm run test:ui:arcade-gameplay
      - name: Add Grade 9 risk practice pilot
        run: |
          mkdir -p dist-desktop/g9-risk-practice-site
          cp -R ../../public/g9-risk-practice-site/. dist-desktop/g9-risk-practice-site/
      - name: Add Grade 9 Summative 2 safety check
        run: |
          mkdir -p dist-desktop/g9-summative2-safety-check-site
          cp -R ../../public/g9-summative2-safety-check-site/. dist-desktop/g9-summative2-safety-check-site/
      - name: Retain previous immutable assets for open student tabs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow static.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$previous_run" ]; then
            previous_dir=$(mktemp -d)
            if gh run download "$previous_run" --repo "$GITHUB_REPOSITORY" --name github-pages --dir "$previous_dir"; then
              mkdir -p "$previous_dir/site"
              tar -xf "$previous_dir/artifact.tar" -C "$previous_dir/site"
              if [ -d "$previous_dir/site/assets" ]; then
                cp -Rn "$previous_dir/site/assets/." dist-desktop/assets/
              fi
            else
              node scripts/retain-hosted-assets.mjs "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
            fi
            node scripts/check-dist-size.mjs
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/sparks/dist-desktop

  deploy:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.validation_only }}
    needs: validate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

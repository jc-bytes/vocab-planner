# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Validation receives read-only repository access. Deployment permissions are
# granted only to the small job that publishes the already-tested artifact.
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.114.0
      - name: Check Docker
        run: docker info
      - name: Start local Supabase
        env:
          SUPABASE_TELEMETRY_DISABLED: 1
        run: supabase start
      - name: Smoke test app shells
        run: npm run test:ui:smoke
      - name: Unit and composition tests
        run: npm test
      - name: Supabase authorization acceptance tests
        run: npm run test:acceptance:supabase
      - name: Diagnose local Supabase failure
        if: failure()
        run: |
          for container in $(docker ps -a --filter 'name=supabase_' --format '{{.Names}}'); do
            echo "===== ${container} ====="
            docker logs --tail 200 "${container}" 2>&1 || true
          done
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Authenticated app smoke
        run: npm run test:ui:auth-smoke
      - name: Responsive authenticated audit
        run: npm run test:ui:responsive:local
      - name: Supabase lint
        run: supabase db lint --local --fail-on error
      - name: Supabase advisors
        run: supabase db advisors --local --level warn --fail-on error --type all
      - name: Build site
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run desktop:build:web
      - name: Smoke test built site
        run: UI_SMOKE_DIST_REUSE=1 npm run test:ui:smoke:dist
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist-desktop

  deploy:
    needs: validate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      validation_only:
        description: "Validate the release without publishing it"
        required: false
        default: false
        type: boolean
      pilot_publish:
        description: "Deprecated compatibility input; Firefox and WebKit checks always run"
        required: false
        default: false
        type: boolean

# Validation receives read-only repository access. Deployment permissions are
# granted only to the small job that publishes the already-tested artifact.
permissions:
  contents: read
  actions: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      UI_SMOKE_PORT: "8560"
      UI_TEACHER_QUIZ_PORT: "8561"
      UI_TEACHER_SPARKS_PORT: "8562"
      UI_TEACHER_PAGES_PORT: "8563"
      UI_TEACHER_DATA_PORT: "8564"
      UI_TEACHER_GROUPS_PORT: "8565"
      UI_TEACHER_WORD_HUNT_PORT: "8566"
      UI_ACTIVITY_REGISTRY_PORT: "8567"
      STUDENT_SHELL_TEST_PORT: "8568"
      UI_CROSS_BROWSER_PORT: "8571"
      UI_AUTH_SMOKE_PORT: "8572"
      UI_AUDIT_PORT: "8573"
      PRIVATE_CLASSROOM_UI_PORT: "8574"
    defaults:
      run:
        working-directory: apps/sparks
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/sparks/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.114.0
      - name: Check Docker
        run: docker info
      - name: Start local Supabase
        env:
          SUPABASE_TELEMETRY_DISABLED: 1
        run: supabase start
      - name: Smoke test app shells
        run: npm run test:ui:smoke
      - name: Configure local worker lifecycle builds
        run: |
          sparks_test_config=$(supabase status --output json)
          printf 'VITE_SUPABASE_URL=%s\n' "$(printf '%s' "$sparks_test_config" | jq -r '.API_URL')" >> "$GITHUB_ENV"
          printf 'VITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$(printf '%s' "$sparks_test_config" | jq -r '.PUBLISHABLE_KEY // .ANON_KEY')" >> "$GITHUB_ENV"
      - name: Unit and composition tests
        run: npm test
      - name: Verify school authorization and database regressions
        run: npm run test:school-platform:rest
      - name: Verify student insight and feedback database regressions
        run: npm run test:student-insight:database
      - name: Verify database authorization, receipts and progress contracts
        run: npm run test:arcade-purchase:database && npm run test:student-mutation-ownership:database && npm run test:school-setting-ownership:database && npm run test:school-progress-snapshot:database && npm run test:selected-profile-export:database && npm run test:student-queue-order:database && npm run test:school-progress-batch:database && npm run test:school-progress-permissions:database && npm run test:school-progress-groups:database && npm run test:policy-request-identity:database && npm run test:progress-lint-compatibility:database
      - name: Supabase authorization acceptance tests
        run: npm run test:acceptance:supabase && npm run test:private-classrooms
      - name: Diagnose local Supabase failure
        if: failure()
        run: |
          for container in $(docker ps -a --filter 'name=supabase_' --format '{{.Names}}'); do
            echo "===== ${container} ====="
            docker logs --tail 200 "${container}" 2>&1 || true
          done
      - name: Dependency audit including build and test tools
        run: npm audit --audit-level=high
      - name: Authenticated app smoke
        run: npm run test:ui:auth-smoke && npm run test:ui:startup-recovery
      - name: Firefox and WebKit focused smoke
        run: npm run test:ui:cross-browser
      - name: Responsive authenticated audit
        run: npm run test:ui:responsive:local
      - name: Supabase lint
        run: supabase db lint --local --fail-on warning
      - name: Supabase advisors
        run: supabase db advisors --local --level warn --fail-on warn --type all
      - name: Align compiled checks with hosted build configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          printf 'VITE_SUPABASE_URL=%s\n' "$VITE_SUPABASE_URL" >> "$GITHUB_ENV"
          printf 'VITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$VITE_SUPABASE_PUBLISHABLE_KEY" >> "$GITHUB_ENV"
      - name: Build site
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run desktop:build:web
      - name: Verify first-paint loading styles before feature startup
        run: LOADING_FIRST_PAINT_DIST=1 npm run test:ui:loading-first-paint
      - name: Verify built private classroom ownership and activity reload
        run: PRIVATE_CLASSROOM_UI_DIST=1 npm run test:private-classrooms
      - name: Verify built student navigation recovery
        run: UI_STUDENT_NAVIGATION_DIST=1 npm run test:ui:student-navigation-recovery
      - name: Verify built authenticated teacher and student flows
        run: UI_AUTH_SMOKE_DIST=1 npm run test:ui:auth-smoke
      - name: Verify built teacher catalog and published material delivery
        run: UI_TEACHER_CATALOG_DIST=1 npm run test:ui:teacher-catalog
      - name: Verify built teacher roster and profile feature ownership
        run: UI_TEACHER_PROGRESS_FEATURE_DIST=1 npm run test:ui:teacher-progress-feature
      - name: Verify built quiz editor replacement and return paths
        run: UI_TEACHER_QUIZ_REPLACEMENT_DIST=1 npm run test:ui:teacher-quiz-replacement
      - name: Verify built teacher vocabulary browser ownership
        run: UI_TEACHER_VOCABULARY_BROWSER_DIST=1 npm run test:ui:teacher-vocabulary-browser
      - name: Verify built teacher save outcomes and reset ownership
        run: UI_TEACHER_VOCABULARY_SAVES_DIST=1 npm run test:ui:teacher-vocabulary-saves
      - name: Verify built explicit local copy recovery
        run: UI_TEACHER_LOCAL_COPIES_DIST=1 npm run test:ui:teacher-local-copies
      - name: Verify built teacher material faces and action ownership
        run: UI_TEACHER_MATERIAL_ACTIONS_DIST=1 npm run test:ui:teacher-material-actions
      - name: Verify built section recovery
        run: SECTION_RECOVERY_DIST=1 npm run test:ui:section-recovery
      - name: Verify built narrow teacher preview controls
        run: UI_TEACHER_PREVIEW_LAYOUT_DIST=1 npm run test:ui:teacher-preview-layout
      - name: Verify built preview content security and independent CSP enforcement
        run: UI_TEACHER_PREVIEW_SECURITY_DIST=1 npm run test:ui:teacher-preview-security:built
      - name: Verify built student Units presentation ownership
        run: UI_STUDENT_UNITS_DIST=1 npm run test:ui:student-units-lazy
      - name: Verify built student unit workspace ownership
        run: UI_STUDENT_UNIT_WORKSPACE_DIST=1 npm run test:ui:student-unit-workspace
      - name: Verify built Home Spark scope ownership
        run: UI_STUDENT_HOME_SPARK_SCOPE_DIST=1 npm run test:ui:student-home-spark-scope
      - name: Verify built Home presentation ownership
        run: UI_STUDENT_HOME_PRESENTATION_DIST=1 npm run test:ui:student-home-presentation
      - name: Verify built shared library style ownership
        run: UI_STUDENT_LIBRARY_STYLES_DIST=1 npm run test:ui:student-library-styles
      - name: Verify built active student attempt runtime ownership
        run: UI_STUDENT_RUNTIME_DIST=1 npm run test:ui:student-active-runtime
      - name: Verify built Word Hunt evidence ownership and persistence
        run: UI_STUDENT_WORD_HUNT_EVIDENCE_DIST=1 npm run test:ui:word-hunt-evidence:built
      - name: Verify built Arcade required-work eligibility
        run: UI_ARCADE_ELIGIBILITY_DIST=1 npm run test:ui:arcade-eligibility
      - name: Verify built mobile Arcade card controls
        run: UI_ARCADE_LAYOUT_DIST=1 npm run test:ui:arcade-layout
      - name: Verify built password changes preserve the other role session
        run: UI_PASSWORD_ISOLATION_DIST=1 npm run test:ui:password-isolation
      - name: Verify built Arcade purchase receipt recovery
        run: UI_ARCADE_PURCHASE_DIST=1 npm run test:ui:arcade-purchase-recovery
      - name: Verify built activity startup fault recovery
        run: UI_ACTIVITY_RECOVERY_DIST=1 npm run test:ui:activity-startup-recovery
      - name: Verify built student worker upgrades
        run: STUDENT_WORKER_LIFECYCLE_REUSE=1 npm run test:ui:worker-lifecycle
      - name: Smoke test built site
        run: UI_SMOKE_DIST_REUSE=1 npm run test:ui:smoke:dist
      - name: Verify built startup recovery
        run: STARTUP_RECOVERY_DIST=1 npm run test:ui:startup-recovery
      - name: Verify built Sparks library and display modes
        run: STUDENT_SPARK_DIST=1 npm run test:ui:student-sparks
      - name: Verify built student and teacher sign-in layouts
        run: AUTH_LAYOUT_DIST=1 npm run test:ui:auth-layout
      - name: Verify built Arcade sprites and gameplay
        run: npm run test:ui:arcade-gameplay
      - name: Add Grade 9 risk practice pilot
        run: |
          mkdir -p dist-desktop/g9-risk-practice-site
          cp -R ../../public/g9-risk-practice-site/. dist-desktop/g9-risk-practice-site/
      - name: Add Grade 9 Summative 2 safety check
        run: |
          mkdir -p dist-desktop/g9-summative2-safety-check-site
          cp -R ../../public/g9-summative2-safety-check-site/. dist-desktop/g9-summative2-safety-check-site/
      - name: Retain previous immutable assets for open student tabs
        run: |
          node scripts/retain-hosted-assets.mjs "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          node scripts/check-dist-size.mjs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/sparks/dist-desktop

  deploy:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.validation_only }}
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release compatibility verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node for release compatibility check
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Verify required hosted owned RPCs before publishing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: node apps/sparks/scripts/verify-owned-rpc-readiness.mjs
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

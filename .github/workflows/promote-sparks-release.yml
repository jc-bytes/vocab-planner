name: Promote validated Sparks release
on:
  workflow_dispatch:
    inputs:
      validated_run:
        description: Successful validation-only Pages run to publish
        required: true
        type: string
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out release verification tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify successful validation and matching application source
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_RUN: ${{ inputs.validated_run }}
        run: |
          [[ "$VALIDATED_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATED_RUN" > run.json
          jq -e '.conclusion == "success" and .path == ".github/workflows/static.yml"' run.json
          source_sha=$(jq -r '.head_sha' run.json)
          for ref in "$source_sha" "$GITHUB_SHA"; do
            gh api "repos/$GITHUB_REPOSITORY/git/trees/$ref" --jq '[.tree[] | select(.path == "apps" or .path == "public") | {path,sha}] | sort_by(.path)' > "$ref.json"
          done
          cmp "$source_sha.json" "$GITHUB_SHA.json"
      - name: Download the validated artifact
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_RUN: ${{ inputs.validated_run }}
        run: |
          gh run download "$VALIDATED_RUN" --repo "$GITHUB_REPOSITORY" --name github-pages --dir validated-artifact
          mkdir validated-site
          tar -xf validated-artifact/artifact.tar -C validated-site
      - name: Retain previously published immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Promotions publish Pages too. Keep two promoted artifacts so a
          # previously skipped release can also be restored during this rollout.
          previous_runs=$(
            gh run list --repo "$GITHUB_REPOSITORY" --workflow static.yml --branch main --status success --limit 1 --json databaseId --jq '.[].databaseId'
            gh run list --repo "$GITHUB_REPOSITORY" --workflow promote-sparks-release.yml --status success --limit 2 --json databaseId --jq '.[].databaseId'
          )
          for previous_run in $previous_runs; do
            previous_dir=$(mktemp -d)
            if gh run download "$previous_run" --repo "$GITHUB_REPOSITORY" --name github-pages --dir "$previous_dir"; then
              mkdir -p "$previous_dir/site"
              tar -xf "$previous_dir/artifact.tar" -C "$previous_dir/site"
              if [ -d "$previous_dir/site/assets" ]; then
                rsync -a --ignore-existing "$previous_dir/site/assets/" validated-site/assets/
              fi
            fi
          done
          node apps/sparks/scripts/retain-hosted-assets.mjs "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" validated-site
          retained_bytes=$(du -sb validated-site | cut -f1)
          test "$retained_bytes" -le $((30 * 1024 * 1024))
      - name: Upload validated Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: validated-site
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128

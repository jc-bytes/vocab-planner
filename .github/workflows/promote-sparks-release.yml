name: Promote validated Sparks release
on:
  workflow_dispatch:
    inputs:
      validated_run:
        description: Successful validation-only Pages run to publish
        required: true
        type: string
permissions:
  contents: write
  actions: read
  pages: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Download only the pinned verifier files; no Git/submodule credentials to clean up.
      - name: Download release verification tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in apps/sparks/scripts/retain-hosted-assets.mjs apps/sparks/scripts/verify-owned-rpc-readiness.mjs .github/scripts/publish-validated-pages.sh; do
            mkdir -p "$(dirname "$file")"
            gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/$file?ref=$GITHUB_SHA" > "$file"
          done
      - name: Setup Node for release verification
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Verify successful validation and matching application source
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_RUN: ${{ inputs.validated_run }}
        run: |
          [[ "$VALIDATED_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATED_RUN" > run.json
          jq -e '.conclusion == "success" and .path == ".github/workflows/static.yml"' run.json
          source_sha=$(jq -r '.head_sha' run.json)
          for ref in "$source_sha" "$GITHUB_SHA"; do
            gh api "repos/$GITHUB_REPOSITORY/git/trees/$ref" --jq '[.tree[] | select(.path == "apps" or .path == "public") | {path,sha}] | sort_by(.path)' > "$ref.json"
          done
          cmp "$source_sha.json" "$GITHUB_SHA.json"
      - name: Download the validated artifact
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_RUN: ${{ inputs.validated_run }}
        run: |
          gh run download "$VALIDATED_RUN" --repo "$GITHUB_REPOSITORY" --name github-pages --dir validated-artifact
          mkdir validated-site
          tar -xf validated-artifact/artifact.tar -C validated-site
      # Validation already pruned candidate assets before Pages packaging.
      # Packaging omits hidden .vite metadata. Refresh only the actual hosted
      # graph here, preserving every tested file without manifest-based pruning.
      - name: Retain previously published immutable assets
        run: |
          node --input-type=module <<'JS'
          import { retainHostedAssets } from './apps/sparks/scripts/retain-hosted-assets.mjs';
          const repository = process.env.GITHUB_REPOSITORY.split('/')[1];
          await retainHostedAssets(`https://${process.env.GITHUB_REPOSITORY_OWNER}.github.io/${repository}/`, 'validated-site');
          JS
          retained_bytes=$(du -sb validated-site | cut -f1)
          test "$retained_bytes" -le $((30 * 1024 * 1024))
      - name: Verify required hosted owned RPCs before publishing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: node apps/sparks/scripts/verify-owned-rpc-readiness.mjs
      - name: Upload validated Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: validated-site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish and verify validated Pages artifact
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-validated-pages.sh validated-site

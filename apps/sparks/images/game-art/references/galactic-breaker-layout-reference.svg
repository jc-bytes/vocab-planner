<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111936"/>
      <stop offset="1" stop-color="#080d1d"/>
    </linearGradient>
    <linearGradient id="paddle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="ball">
      <stop offset="0" stop-color="#fffbea"/>
      <stop offset="0.5" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="768" height="1024" fill="url(#background)"/>
  <g fill="#ffffff" opacity="0.45">
    <circle cx="74" cy="80" r="2"/><circle cx="181" cy="145" r="1.5"/>
    <circle cx="654" cy="112" r="2"/><circle cx="712" cy="322" r="1.5"/>
    <circle cx="115" cy="552" r="1.5"/><circle cx="621" cy="604" r="2"/>
    <circle cx="54" cy="872" r="2"/><circle cx="697" cy="908" r="1.5"/>
  </g>

  <!-- Four rows of nine bricks, matching Galactic Breaker's opening board. -->
  <g stroke="#ffffff" stroke-opacity="0.28" stroke-width="2">
    <g fill="#f59e0b">
      <rect x="32" y="112" width="70" height="46" rx="7"/><rect x="111" y="112" width="70" height="46" rx="7"/>
      <rect x="190" y="112" width="70" height="46" rx="7"/><rect x="269" y="112" width="70" height="46" rx="7"/>
      <rect x="348" y="112" width="70" height="46" rx="7"/><rect x="427" y="112" width="70" height="46" rx="7"/>
      <rect x="506" y="112" width="70" height="46" rx="7"/><rect x="585" y="112" width="70" height="46" rx="7"/>
      <rect x="664" y="112" width="70" height="46" rx="7"/>
    </g>
    <g fill="#ef4444">
      <rect x="32" y="171" width="70" height="46" rx="7"/><rect x="111" y="171" width="70" height="46" rx="7"/>
      <rect x="190" y="171" width="70" height="46" rx="7"/><rect x="269" y="171" width="70" height="46" rx="7"/>
      <rect x="348" y="171" width="70" height="46" rx="7"/><rect x="427" y="171" width="70" height="46" rx="7"/>
      <rect x="506" y="171" width="70" height="46" rx="7"/><rect x="585" y="171" width="70" height="46" rx="7"/>
      <rect x="664" y="171" width="70" height="46" rx="7"/>
    </g>
    <g fill="#ef4444">
      <rect x="32" y="230" width="70" height="46" rx="7"/><rect x="111" y="230" width="70" height="46" rx="7"/>
      <rect x="190" y="230" width="70" height="46" rx="7"/><rect x="269" y="230" width="70" height="46" rx="7"/>
      <rect x="348" y="230" width="70" height="46" rx="7"/><rect x="427" y="230" width="70" height="46" rx="7"/>
      <rect x="506" y="230" width="70" height="46" rx="7"/><rect x="585" y="230" width="70" height="46" rx="7"/>
      <rect x="664" y="230" width="70" height="46" rx="7"/>
    </g>
    <g>
      <rect x="32" y="289" width="70" height="46" rx="7" fill="#ef4444"/>
      <rect x="111" y="289" width="70" height="46" rx="7" fill="#ef4444"/>
      <rect x="190" y="289" width="70" height="46" rx="7" fill="#3b82f6"/>
      <rect x="269" y="289" width="70" height="46" rx="7" fill="#ef4444"/>
      <rect x="348" y="289" width="70" height="46" rx="7" fill="#8b5cf6"/>
      <rect x="427" y="289" width="70" height="46" rx="7" fill="#ef4444"/>
      <rect x="506" y="289" width="70" height="46" rx="7" fill="#ec4899"/>
      <rect x="585" y="289" width="70" height="46" rx="7" fill="#ef4444"/>
      <rect x="664" y="289" width="70" height="46" rx="7" fill="#ef4444"/>
    </g>
  </g>

  <!-- One broken-brick gap and restrained debris clarify the action. -->
  <rect x="427" y="230" width="70" height="46" rx="7" fill="#111936"/>
  <g fill="#ef4444" filter="url(#softGlow)">
    <path d="M440 250l14-16 12 12-10 16z"/><path d="M478 238l12 9-8 13-11-8z"/>
    <path d="M455 277l10-11 11 8-8 13z"/>
  </g>

  <!-- Short dotted trajectory: this is a bouncing ball, never a beam. -->
  <path d="M370 817 Q394 681 455 540 Q476 476 463 414" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 25" opacity="0.42"/>
  <circle cx="463" cy="403" r="18" fill="url(#ball)" filter="url(#softGlow)"/>

  <!-- Wide simple paddle with no wings, cockpit, or weapon features. -->
  <rect x="264" y="866" width="240" height="34" rx="14" fill="url(#paddle)" stroke="#c4b5fd" stroke-width="3" filter="url(#softGlow)"/>
</svg>

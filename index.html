<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Master</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="landing-container">
        <header class="landing-header">
            <div class="brand-mark" aria-hidden="true">
                <i data-lucide="book-open-check"></i>
            </div>
            <h1>Vocabulary Master</h1>
            <p>Interactive vocabulary learning for everyone.</p>
        </header>
        
        <main class="landing-options">
            <a href="student.html" class="card option-card student-card">
                <div class="option-icon" aria-hidden="true">
                    <i data-lucide="graduation-cap"></i>
                </div>
                <h2>Student Mode</h2>
                <p>Practice vocabulary, play games, and track your progress.</p>
            </a>
            
            <a href="teacher.html" class="card option-card teacher-card">
                <div class="option-icon" aria-hidden="true">
                    <i data-lucide="presentation"></i>
                </div>
                <h2>Teacher Mode</h2>
                <p>Create vocabulary sets and manage content.</p>
            </a>
        </main>

        <footer class="landing-footer">
            <p>
                <span data-desktop-version>Web version</span>
                ·
                <span data-network-status>Online</span>
                ·
                <a href="https://github.com/" data-desktop-update-link>Check for installer updates</a>
            </p>
        </footer>
    </div>
    <script src="js/icons.js" type="module"></script>
    <script src="js/main.js" type="module"></script>
    <script src="js/desktop.js" type="module"></script>
</body>
</html>
